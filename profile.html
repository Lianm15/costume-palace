<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
    <nav>
  <div class="logo">Costume <span>Palace</span></div>
  <div class="nav-links">
    <a href="#" class="login">Login</a>
    <a href="/">Home</a>
  </div>
</nav>

<div class="profile-container"></div>
  <h1 style="text-align:center;">My Profile</h1>

  <div style="max-width:600px; margin:30px auto; justify-items: center;">


    <h2 style="padding-top: 2rem;">My Orders</h2>
    <div id="orders"></div>

    <div style="justify-content: center; padding-top: 2rem; ">
      <button class="submit-btn" onclick="logout()">Logout</button>
    </div>

  </div>
  </div>

<script>
function getCookie(name) {
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}

function logout() {
  window.location.href = "/logout";
}

function getCookie(name) {
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}

let currentUser = getCookie('username');
let isAdmin     = getCookie('is_admin') === '1';

if (currentUser) {
  const loginLink = document.querySelector('.nav-links .login');

  loginLink.textContent = '👤 ' + currentUser;
  loginLink.href = '/profile'; 

  if (isAdmin) {
    document.querySelector('.nav-links').innerHTML +=
      '<a href="/admin" class="admin-link">⚙️ Admin</a>';
  }
}

const username = getCookie('username');

// load orders
fetch('/api/orders', {
  credentials: 'include'
})
  .then(r => r.json())
  .then(data => {
    console.log("ORDERS:", data); 

    const div = document.getElementById('orders');
    div.innerHTML = '';

    if (data.length === 0) {
      div.innerHTML = "<p>No orders yet</p>";
      return;
    }

    data.forEach(o => {
      const box = document.createElement('div');
      box.className = 'order-box';
      
      const statusColor = o.status === 'Pending' ? '#f59e0b' : o.status === 'Approved' ? '#3b82f6' : o.status === 'Shipped' ? '#10b981' : '#ef4444';
      const dateStr = o.created_at ? new Date(o.created_at).toLocaleString() : 'N/A';

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f3f4f6; padding-bottom:10px; margin-bottom:15px;">
          <div>
            <h3 style="margin:0; color:#ff6b35; font-family:'Fredoka One',cursive;">Order #${o.id}</h3>
            <small style="color:#9ca3af;">${dateStr}</small>
          </div>
          <div style="text-align:right;">
            <span style="background:${statusColor}; color:white; padding:4px 10px; border-radius:15px; font-weight:700; font-size:0.85rem;">${o.status || 'Pending'}</span>
            <p style="margin:8px 0 0 0; font-weight:700; font-size:1.1rem; color:#2d2d2d;">Total: ₪${o.total}</p>
          </div>
        </div>
        <div id="items-${o.id}" style="display:flex; flex-direction:column; gap:12px;"></div>
      `;

      document.getElementById('orders').appendChild(box);

      // load items
      fetch('/api/orders/' + o.id)
        .then(r => r.json())
        .then(items => {
          const itemsDiv = document.getElementById('items-' + o.id);

          items.forEach(item => {
            itemsDiv.innerHTML += `
              <div class="order-item" style="display:flex; align-items:center; gap:15px; background:#fff8f0; padding:10px 15px; border-radius:12px; border:1px solid #fff0e6;">
                <img src="/images/${item.image}" style="width:60px; height:60px; object-fit:cover; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.05);">
                <div style="flex:1;">
                  <strong style="color:#2d2d2d; font-size:1.05rem;">${item.name}</strong>
                  <div style="color:#6b7280; font-size:0.9rem; margin-top:4px;">Qty: ${item.quantity} · ₪${item.price} each</div>
                </div>
              </div>
            `;
          });
        });
    });
  });
</script>

</body>
